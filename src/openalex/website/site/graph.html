<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="OpenAlex event keyword co-occurrence network">
    <title>Graph · OpenAlex Events</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <div>
          <p class="eyebrow">OpenAlex events</p>
          <h1>Co-occurrence graph</h1>
          <nav aria-label="Site">
            <a href="index.html">Top keywords</a>
            <a href="dendrogram.html">Dendrogram</a>
            <a href="graph.html" aria-current="page">Graph</a>
          </nav>
        </div>
        <div class="toolbar-actions graph-actions">
          <p class="intro" id="summary">Loading graph…</p>
          <div class="mode-switch" role="group" aria-label="Graph mode">
            <button id="keyword-mode" type="button" aria-pressed="true">Keywords</button>
            <button id="cluster-mode" type="button" aria-pressed="false">Clusters</button>
          </div>
          <button id="reset" type="button" disabled>Reset view</button>
        </div>
      </header>
      <section class="workspace card">
        <div class="graph-panel">
          <canvas id="graph" aria-label="Keyword co-occurrence graph"></canvas>
          <div id="tooltip" class="tooltip" hidden></div>
          <p class="hint">Scroll to zoom · drag to pan · click a node to pin</p>
        </div>
        <aside id="details" class="details" aria-live="polite">
          <div class="empty">
            <p class="eyebrow">Co-occurrence graph</p>
            <h2>Select a node</h2>
            <p>Its yearly paper frequency and cluster membership will appear here.</p>
          </div>
        </aside>
      </section>
    </main>
    <script src="graph.js" defer></script>
  </body>
</html>
